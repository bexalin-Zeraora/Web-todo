<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daylist — To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand-mark">✓</div>
      <div>
        <p class="eyebrow">MAKE TODAY COUNT</p>
        <h1>Daylist<span>.</span></h1>
      </div>
    </header>

    <section class="intro">
      <p class="date-label">YOUR PERSONAL TASK SPACE</p>
      <h2>Small steps.<br><em>Big progress.</em></h2>
      <p class="subtext">Write it down, check it off, keep moving.</p>
    </section>

    <section class="task-card">
      <form id="taskForm" class="task-form">
        <label for="taskInput">Add a task</label>
        <div class="input-row">
          <input id="taskInput" type="text" placeholder="What do you need to do?" maxlength="120" autocomplete="off">
          <button type="submit" class="add-button" aria-label="Add task">+</button>
        </div>
        <p id="errorMessage" class="error" aria-live="polite"></p>
      </form>

      <div class="list-heading">
        <h3>My tasks</h3>
        <span id="taskCount" class="count">0 tasks</span>
      </div>
      <ul id="taskList" class="task-list"></ul>
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">✦</div>
        <strong>Your list is clear</strong>
        <span>Add your first task above to get started.</span>
      </div>
      <div class="bottom-row">
        <span id="progressText">You’ve got this.</span>
        <button id="clearCompleted" class="text-button" type="button">Clear completed</button>
      </div>
    </section>
    <footer>Made with HTML, CSS &amp; jQuery</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
